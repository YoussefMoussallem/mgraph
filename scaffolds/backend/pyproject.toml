[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend-scaffold"
version = "0.1.0"
description = "AI Labs FastAPI backend scaffold — Microsoft Entra ID auth wired end to end"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.8.30",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # >=2.9: issuer= accepts a list, needed for the v1 + v2 Entra issuers.
    "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
# Microsoft Graph on the caller's behalf (app/graph.py). Delete together
# with that module if the app does not call Graph.
m365 = [
    "m365-client>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
