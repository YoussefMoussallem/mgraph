site_name: AI Labs Python SDKs
site_description: LLM adapter, Langfuse tracing helpers, and Microsoft 365 SDKs (Graph foundation, Outlook, SharePoint)
site_url: https://pwc-me-adv-strategyand.github.io/infra-platform-services/python/
repo_url: https://github.com/pwc-me-adv-strategyand/infra-platform-services
repo_name: infra-platform-services

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Installation: installation.md
  - llm-provider:
      - Getting started: llm-provider/index.md
      - Streaming & events: llm-provider/streaming.md
      - Prompt caching: llm-provider/caching.md
      - Utility calls & images: llm-provider/utilities.md
      - Errors & retries: llm-provider/errors.md
  - langfuse-client:
      - Getting started: langfuse-client/index.md
      - Lifecycle & guarantees: langfuse-client/lifecycle.md
      - Corporate proxy / private CA: langfuse-client/corporate-network.md
  - m365-client:
      - Getting started: m365-client/index.md
      - Authentication & token flows: m365-client/authentication.md
      - Errors & retries: m365-client/errors.md
      - Corporate networks: m365-client/corporate-network.md
  - outlook-client:
      - Getting started: outlook-client/index.md
  - sharepoint-client:
      - Getting started: sharepoint-client/index.md
  - m365-langchain-tools:
      - Getting started: m365-langchain-tools/index.md
  - Deployment guide: deployment.md
