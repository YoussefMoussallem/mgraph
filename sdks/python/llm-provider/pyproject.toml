[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-provider"
version = "0.4.0"
description = "OpenAI-compatible LLM adapter with streaming, tool use, and prompt caching"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60.0",
    "pydantic>=2.9.0",
    "langfuse-client>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
